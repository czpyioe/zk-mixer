[package]
name = "prover"
version = "0.1.0"
edition = "2024"

# https://wasm-bindgen.github.io/wasm-pack/book/tutorials/npm-browser-packages/template-deep-dive/cargo-toml.html
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
circuits = { path = "../circuits" }
ark-bn254 = "0.4"
ark-ff = "0.4"
ark-groth16 = "0.4"
ark-snark = "0.4"
ark-serialize = "0.4"
rand = "0.8"
anyhow = "1.0.102"

# WASM bindings + (de)serialization of the JS <-> Rust payloads.
wasm-bindgen = "0.2"
serde_json = "1.0"
hex = "0.4"

# In the browser, `getrandom` (pulled in by `rand`'s OsRng) needs the `js`
# feature to source entropy from the Web Crypto API. This only applies to wasm
# builds, so it's scoped to the wasm target and doesn't affect native tests.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }